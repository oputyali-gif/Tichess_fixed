plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sara.chess'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sara.chess'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // المحركات ملفات تنفيذية داخل jniLibs (libsara.so / libstockfish.so) ويجب استخراجها عند التثبيت
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
