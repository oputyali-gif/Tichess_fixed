name: Build Tichess APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          fi
          echo "Using NDK: $NDK"
          echo "NDK_BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build Sara engine (arm64)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$NDK_BIN/aarch64-linux-android29-clang++" -O2 -std=c++17 -pthread -static-libstdc++ -s \
            engine/sara/Sara_Engine99.cpp -o app/src/main/jniLibs/arm64-v8a/libsara.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # نسخة خفيفة: Sara فقط (بدون شبكة Stockfish العصبية)
      - name: Build lite APK (Sara only)
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Tichess-lite.apk

      # Stockfish: نستعمل الملف الجاهز إن وُضع في engine/stockfish/stockfish-android-arm64، وإلا نبنيه من المصدر
      - name: Prepare Stockfish (arm64)
        id: sf
        continue-on-error: true
        run: |
          set -e
          DEST=app/src/main/jniLibs/arm64-v8a/libstockfish.so
          if [ -f engine/stockfish/stockfish-android-arm64 ]; then
            echo "Using the prebuilt Stockfish binary from the repo"
            cp engine/stockfish/stockfish-android-arm64 "$DEST"
          else
            echo "No prebuilt binary - building Stockfish from source"
            export PATH="$NDK_BIN:$PATH"
            (cd engine/stockfish/src && make -j"$(nproc)" build ARCH=armv8 COMP=ndk && "$NDK_BIN/llvm-strip" stockfish || true)
            cp engine/stockfish/src/stockfish "$DEST"
          fi
          chmod +x "$DEST"
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build full APK (Sara + Stockfish)
        if: steps.sf.outcome == 'success'
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Tichess-full.apk

      - name: Stockfish status
        run: |
          if [ "${{ steps.sf.outcome }}" != "success" ]; then
            echo "::warning::Stockfish was not added - only the lite APK (Sara) was produced"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tichess-APKs
          path: Tichess-*.apk

      - name: Publish release (direct download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tichess build ${{ github.run_number }}
          files: Tichess-*.apk
